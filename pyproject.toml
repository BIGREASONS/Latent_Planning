[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latent_planning"
version = "0.1.0"
description = "Diagnosing Failure Modes of Latent Planning in Frozen Language Models"
authors = [
    { name="Research Engineer" }
]
requires-python = ">=3.9"
dependencies = [
    "torch",
    "transformers",
    "peft",
    "accelerate",
    "datasets",
    "wandb",
    "scikit-learn",
    "matplotlib",
    "pandas>=2.0.0",
    "python-dotenv",
    "bitsandbytes",
    "tqdm"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
