[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latent_planning"
version = "0.1.0"
description = "Diagnosing Failure Modes of Latent Planning in Frozen Language Models"
authors = [
    { name="Research Engineer" }
]
requires-python = ">=3.9"
dependencies = [
    "torch==2.8.0",
    "transformers==4.57.1",
    "peft==0.17.1",
    "accelerate==1.11.0",
    "datasets==4.4.1",
    "wandb",
    "scikit-learn",
    "matplotlib",
    "pandas>=2.0.0",
    "python-dotenv",
    "bitsandbytes",
    "tqdm"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort"
]

[tool.setuptools.packages.find]
include = ["data_processing", "models", "training", "evaluation"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
